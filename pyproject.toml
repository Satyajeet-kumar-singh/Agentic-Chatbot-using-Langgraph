[project]
name = "agentic-chatbot-using-langgraph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "satyajeet-kumar-singh", email = "satyavrajput9898@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.15.0",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.13.5",
    "pypdf>=6.18.1",
    "python-dotenv>=1.2.3",
    "streamlit>=1.63.0",
    "tavily-python>=0.8.3",
]

[project.scripts]
agentic-chatbot-using-langgraph = "agentic_chatbot_using_langgraph:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
